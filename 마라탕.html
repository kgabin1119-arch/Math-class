<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중복조합 탐구 실험실</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #fffaf2; color: #332f2b;
  }
  .wrap { max-width: 850px; margin: 0 auto; }
  h1 { text-align: center; margin: 8px 0 8px; font-size: clamp(25px, 5vw, 34px); }
  .sub { text-align: center; color: #77716b; margin: 0 0 26px; line-height: 1.6; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
    background: white; border: 1px solid #eee3d5; border-radius: 18px;
    padding: 18px; box-shadow: 0 4px 14px #5b3b1710;
  }
  .field { display: flex; align-items: center; gap: 9px; font-weight: 700; }
  input {
    width: 82px; padding: 11px 8px; border: 2px solid #e7d8c7;
    border-radius: 10px; font-size: 20px; text-align: center; color: #332f2b;
    background: #fffdf9;
  }
  input:focus { outline: 3px solid #f4d9a8; border-color: #d89b42; }
  button {
    border: 0; border-radius: 10px; padding: 12px 22px;
    background: #d98e38; color: white; font-size: 16px; font-weight: 800;
    cursor: pointer;
  }
  button:hover { background: #bf7627; }
  .hint { text-align: center; font-size: 13px; color: #898078; margin: 11px 0 25px; }
  .section {
    background: white; border: 1px solid #eee3d5; border-radius: 18px;
    padding: 20px; margin: 16px 0; box-shadow: 0 4px 14px #5b3b170a;
  }
  h2 { font-size: 19px; margin: 0 0 14px; }
  .ingredients { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 10px; }
  .ingredient {
    min-height: 86px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 5px; background: #fff7e9; border: 1px solid #f1dfc3;
    border-radius: 13px; font-weight: 700;
  }
  .emoji { font-size: 31px; }
  .muted { color: #8a8178; font-size: 13px; font-weight: 500; }
  .bowl-area { overflow-x: auto; padding: 8px 2px 4px; }
  .bowl {
    min-width: min-content; display: flex; justify-content: center; align-items: stretch;
    margin: 0 auto; width: fit-content; max-width: 100%;
    border: 4px solid #c98b56; border-top: 0; border-radius: 0 0 28px 28px;
    background: #fff8ed; padding: 12px 10px 17px; gap: 5px;
    box-shadow: inset 0 -8px 0 #f5e5d1;
  }
  .slot {
    width: 42px; min-width: 42px; height: 70px; border: 1.5px dashed #d7b58d;
    border-radius: 9px; display: flex; align-items: center; justify-content: center;
    color: #b28b63; font-size: 12px; background: #fffdf9;
  }
  .slot:nth-child(odd) { background: #fffaf3; }
  .result { text-align: center; }
  .formula { font-size: clamp(22px, 5vw, 30px); font-weight: 900; color: #a65f1d; margin: 6px 0 9px; }
  .explain { color: #716960; line-height: 1.7; margin: 0; }
  .role {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px;
  }
  .role div { background: #fff8ed; padding: 12px; border-radius: 12px; line-height: 1.55; }
  .role strong { display: block; color: #a65f1d; margin-bottom: 3px; }
  .error { color: #b34232; text-align: center; margin: 10px 0 0; font-size: 14px; }
  @media (max-width: 520px) {
    body { padding: 17px 11px 30px; }
    .section { padding: 16px 13px; }
    .role { grid-template-columns: 1fr; }
    .slot { width: 34px; min-width: 34px; height: 62px; }
    .controls { gap: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🍡 중복조합 탐구 실험실</h1>
  <p class="sub">재료의 종류와 선택하는 개수를 바꿔 보며<br>중복조합의 값을 비교해 보세요.</p>

  <div class="controls">
    <label class="field">재료 종류 수 n
      <input id="nInput" type="number" min="1" max="20" placeholder="n" required>
    </label>
    <label class="field">선택 횟수 r
      <input id="rInput" type="number" min="0" max="20" placeholder="r" required>
    </label>
    <button id="showBtn" type="button">확인하기</button>
  </div>
  <p class="hint">n은 1~20, r은 0~20까지 입력할 수 있어요.</p>
  <p class="error" id="error" role="alert"></p>

  <section class="section">
    <h2>🥬 준비된 재료 <span class="muted">(n = 재료의 종류 수)</span></h2>
    <div class="ingredients" id="ingredients"></div>
  </section>

  <section class="section">
    <h2>🥣 주문 그릇 <span class="muted">(r = 선택하는 전체 개수)</span></h2>
    <div class="bowl-area"><div class="bowl" id="bowl"></div></div>
    <p class="muted" style="text-align:center; margin:12px 0 0;">그릇의 칸 하나가 재료 한 개를 선택하는 자리예요.</p>
  </section>

  <section class="section result">
    <h2>계산 결과</h2>
    <div class="formula" id="formula">n과 r을 입력해 주세요</div>
    <p class="explain" id="explanation"></p>
  </section>

  <section class="section">
    <h2>숫자의 의미 확인하기</h2>
    <div class="role">
      <div><strong>n : 재료의 종류 수</strong>서로 다른 재료가 몇 종류 준비되어 있는지 나타내요.</div>
      <div><strong>r : 선택하는 전체 개수</strong>그 재료들 중 모두 합쳐 몇 개를 고르는지 나타내요.</div>
    </div>
  </section>
</div>
<script>
const names = [
  ["숙주","🥬"],["청경채","🥗"],["분모자","🍜"],["버섯","🍄"],["두부","🧊"],
  ["옥수수","🌽"],["소시지","🌭"],["유부","🟨"],["당면","🍝"],["연근","🪷"],
  ["감자","🥔"],["배추","🥬"],["치즈","🧀"],["새우","🍤"],["어묵","🍢"],
  ["브로콜리","🥦"],["메추리알","🥚"],["떡","🍡"],["곤약","⬜"],["고구마","🍠"]
];
const nInput = document.getElementById("nInput");
const rInput = document.getElementById("rInput");
const ingredients = document.getElementById("ingredients");
const bowl = document.getElementById("bowl");
const formula = document.getElementById("formula");
const explanation = document.getElementById("explanation");
const error = document.getElementById("error");

function choose(a, b) {
  if (b < 0 || b > a) return 0n;
  if (b > a - b) b = a - b;
  let value = 1n;
  for (let i = 1; i <= b; i++) value = value * BigInt(a - b + i) / BigInt(i);
  return value;
}
function render() {
  const n = Number(nInput.value);
  const r = Number(rInput.value);
  if (nInput.value.trim() === "" || rInput.value.trim() === "" || !Number.isInteger(n) || !Number.isInteger(r) || n < 1 || n > 20 || r < 0 || r > 20) {
    error.textContent = "n은 1~20, r은 0~20 사이의 정수로 입력해 주세요. 두 칸을 모두 채워 주세요.";
    return;
  }
  error.textContent = "";
  ingredients.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const item = document.createElement("div");
    item.className = "ingredient";
    item.innerHTML = `<span class="emoji">${names[i][1]}</span><span>${names[i][0]}</span>`;
    ingredients.appendChild(item);
  }
  bowl.innerHTML = "";
  for (let i = 0; i < r; i++) {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.textContent = i + 1;
    bowl.appendChild(slot);
  }
  const answer = choose(n + r - 1, r);
  formula.textContent = `${n}H${r} = ${answer.toString()}`;
  explanation.textContent = `서로 다른 재료 ${n}종류 중에서, 중복을 허용하여 모두 ${r}개를 선택하는 경우의 수예요.`;
}
document.getElementById("showBtn").addEventListener("click", render);
nInput.addEventListener("keydown", e => { if (e.key === "Enter") render(); });
rInput.addEventListener("keydown", e => { if (e.key === "Enter") render(); });
// 처음에는 n과 r을 비워 두고, 확인하기를 눌렀을 때만 결과를 보여 줍니다.
</script>
</body>
</html>
